
---

- hosts: all
  become: true
  gather_facts: true     ##lock/unlock if needed.
  pre_tasks:

  - name: Install updates (Ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts['os_family'] == "Debian"

  - name: Install updates (Rocky)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_facts['os_family'] == "RedHat"


- hosts: web_servers
  become: true
  tasks:

  - name: Install apache and php for Ubuntu servers
    tags: web,ubuntu,apache
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: present
    when: ansible_facts['os_family'] == "Debian"

  - name: Install httpd and php for Rocky servers
    tags: rocky,web,httpd
    dnf:
      name:
        - httpd
        - php
      state: present
    when: ansible_facts['os_family'] == "RedHat"

- hosts: db_servers
  become: true
  tasks:

  - name: Install mariadb package (Ubuntu)
    tags: db,ubuntu,mariadb
    apt:
      name: mariadb-servers
      state: present
    when: ansible_facts['os_family'] == "Debian"

  - name: Install mariadb package (Rocky)
    tags: rocky,mariadb,db
    dnf:
      name: mariadb-server
      state: present
    when: ansible_facts['os_family'] == "RedHat"

#  - name: Enable and start mariadb (Rocky)
