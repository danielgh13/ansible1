#      name: mariadb
#      enabled: yes
#      state: started
#    when: ansible_facts['os_family'] == "RedHat"


- hosts: file_servers
  become: true
  tasks:

  - name: Install samba package (Ubuntu)
    tags: samba
    package:
      name: samba
      state: present
    when: ansible_facts['os_family'] == "Debian"

